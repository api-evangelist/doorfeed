name: DoorFeed
description: 'DoorFeed is a technology-led residential real estate investment platform,
  founded in 2021 and headquartered in Paris, that helps institutional investors,
  funds, and family offices source and manage single-family rental portfolios at scale
  across the UK and France. The platform ingests roughly 150,000 new property listings
  and over 1,000,000 property images every day, structuring market data, comparable
  transactions, valuation signals, and energy-performance data into a single acquisition
  and asset-management workflow that takes investors from market screening to investment
  decision in minutes. DoorFeed is backed by HV Capital, Seedcamp, and Motive Partners.
  This profile was added to the API Evangelist network as a portfolio-company lead
  and enriched by the pipeline; DoorFeed publishes no public API or developer program
  at this time.'
